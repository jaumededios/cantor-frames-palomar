name: comparator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.0"
          cache: false
      - name: Cache Comparator toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/cantor-frames-palomar
          key: comparator-${{ hashFiles('lean-toolchain', 'verify.sh') }}
      - name: Run Comparator
        run: ./verify.sh
