literature:
  summary_provenance:
    generated_by: "Codex (OpenAI)"
    status: "automated summary of the source paper"
    basis: >-
      Sections 1.2--1.4 and the bibliography of arXiv:2607.08656v1.
    caveat: >-
      This is an automated summary of the paper's literature account, included
      for reviewer orientation. It is not a new or independent literature
      review and makes no independent novelty claim.
  context: >-
    As summarized from the source paper, Jorgensen and Pedersen proved that the
    fair {0,2} Cantor measures with even base are spectral. For odd bases,
    known bounds on mutually orthogonal exponentials ruled out an exponential
    basis but did not rule out the weaker possibility of a Fourier frame.
    Strichartz consequently asked whether the middle-third Cantor measure is
    frame-spectral. In contrast to the obstruction to an exponential basis,
    non-spectrality alone does not preclude a Fourier frame: Lai and Wang
    exhibited non-spectral fractal measures which nevertheless admit Fourier
    frames, and Picioroaga and Weber constructed exponential Parseval frames
    for the Cantor-4 measure. Dutkay, Emami, and Lai also showed that the
    middle-third measure admits very large exponential Riesz sequences, a
    positive result short of a frame. Theorem 1.1 settles the question for
    every odd b > 1; combined with the even-base construction, it gives the
    parity classification that the measure admits a Fourier frame exactly when
    b is even.
  directly_related:
    - citation: >-
        R. S. Strichartz, "Mock Fourier series and transforms associated with
        certain Cantor measures", J. Anal. Math. 81 (2000), 209--238.
      doi: "10.1007/BF02788990"
      relationship: >-
        Poses the middle-third Cantor-measure Fourier-frame question answered
        by Theorem 1.1 of the primary source.
    - citation: >-
        P. E. T. Jorgensen and S. Pedersen, "Dense analytic subspaces in
        fractal L²-spaces", J. Anal. Math. 75 (1998), 185--228.
      doi: "10.1007/BF02788699"
      relationship: >-
        Establishes the complementary even-base spectral construction used
        with Theorem 1.1 to obtain the parity classification.
    - citation: >-
        C. Lai and Y. Wang, "Non-spectral fractal measures with Fourier
        frames", J. Fractal Geom. 4 (2017), 305--327.
      doi: "10.4171/JFG/52"
      relationship: >-
        Shows why non-spectrality alone does not rule out Fourier frames and
        therefore does not already imply the odd-base theorem.
    - citation: >-
        G. Picioroaga and E. S. Weber, "Fourier frames for the Cantor-4 set",
        J. Fourier Anal. Appl. 23 (2017), 324--343.
      doi: "10.1007/s00041-016-9471-0"
      relationship: >-
        Gives a related positive construction of exponential Parseval frames
        for the even-base Cantor-4 measure.
    - citation: >-
        D. E. Dutkay, S. Emami, and C. Lai, "Existence and exactness of
        exponential Riesz sequences and frames for fractal measures",
        J. Anal. Math. 143 (2021), 289--311.
      doi: "10.1007/s11854-021-0156-5"
      relationship: >-
        Proves that the middle-third Cantor measure has an exponential Riesz
        sequence of maximal possible Beurling dimension, while not supplying
        the Fourier frame excluded by Theorem 1.1.
  related_formalizations: >-
    The Lean development linked by the primary source is the proof dependency
    pinned above. This repository is only a Palomar Comparator wrapper around
    that development, not a second formalization or an independent proof.

