alignment:
  namespace: ""
  statements:
    - source: "Theorem 1.1 and Appendix 5, arXiv:2607.08656v1"
      lean: "NoFourierFrameExists"
      module: "Challenge"
      status: "proved"
      note: >-
        For b > 1 odd, every natural-number-indexed family of L²(cantor_μ b)
        functions that is almost everywhere an exponential fails the frame
        inequalities. This is the exact public formulation displayed in
        Appendix 5, not a claim of additional index-type generality.

acknowledgements: >-
  The formalization relies on Lean 4 and Mathlib. The mathematical and
  formalization provenance is described in arXiv:2607.08656v1.

palomar:
  plain_language_claim: >-
    If b > 1 is odd, no countable family of complex exponentials is a frame
    for the L² space of the fair {0, 2} base-b Cantor measure.
  known_fidelity_gaps: >-
    No known mathematical gap. The Bool/Fin 2 representation choice and the
    scope boundary are disclosed under fidelity.
  extra_assumptions: "None beyond b > 1 and Odd b."
  novelty: >-
    This wrapper makes no independent novelty claim. The source paper presents
    Theorem 1.1 as settling Strichartz's question and provides the mathematical
    provenance and broader literature review.
