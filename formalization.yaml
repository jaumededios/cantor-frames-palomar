palomar:
  plain_language_claim: >-
    If b > 1 is odd, no countable family of complex exponentials is a frame
    for the L² space of the fair {0, 2} base-b Cantor measure.
  known_fidelity_gaps: >-
    No known mathematical gap. The Bool/Fin 2 representation choice and the
    scope boundary are disclosed under fidelity.
  extra_assumptions: "None beyond b > 1 and Odd b."
  novelty: >-
    This wrapper makes no independent novelty claim. The literature context
    above is an automated Codex summary of Sections 1.2--1.4 of the source
    paper, not an independent literature review. The source paper presents
    Theorem 1.1 as settling Strichartz's question; consult that paper for the
    authors' claims, full mathematical provenance, and complete bibliography.
